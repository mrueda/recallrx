name: Documentation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build fresh recall data
        run: python -m openrecall build --output data --config openrecall.config.json

      - name: Validate fresh recall data
        run: python -m openrecall validate data

      - name: Build live search app for docs site
        run: python -m openrecall dist --output docs-site/static/app

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Typecheck docs
        working-directory: docs-site
        run: npm run typecheck

      - name: Build Docusaurus site
        working-directory: docs-site
        run: npm run build

      - name: Verify search index
        working-directory: docs-site
        run: test -s build/search-index.json

      - name: Verify embedded search app
        working-directory: docs-site
        run: test -s build/app/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
