name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate recall data
        run: python -m recallrx validate data

      - name: Check embedded app JavaScript
        run: |
          node --check site/app.js
          node --check site/freshness.js
          node tests/test_freshness.js

      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci

      - name: Typecheck documentation
        working-directory: docs-site
        run: npm run typecheck

      - name: Build documentation and embedded app
        working-directory: docs-site
        run: npm run build

      - name: Verify production output
        working-directory: docs-site
        run: |
          test -s build/search-index.json
          test -s build/app/index.html
