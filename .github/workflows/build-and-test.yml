name: Build and test

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    name: Python ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run unit tests
        run: pytest

      - name: Compile Python files
        run: python -m py_compile src/recallrx/*.py src/recallrx/adapters/*.py tests/*.py

      - name: Validate seed data
        run: python -m recallrx validate data

      - name: Check frontend JavaScript
        run: node --check site/app.js

      - name: Build static app
        run: python -m recallrx dist
