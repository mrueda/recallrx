name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: pytest
      - name: Validate data
        run: python -m openrecall_es validate data
      - name: Check frontend JavaScript
        run: node --check site/app.js
      - name: Build static dist
        run: python -m openrecall_es dist
