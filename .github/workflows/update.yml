name: Update Dataset

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: python -m pip install -e ".[test]"
      - name: Build data with Python collector
        run: python -m openrecall_es build --output data
      - name: Validate data
        run: python -m openrecall_es validate data
      - name: Commit data changes
        run: |
          if [ -n "$(git status --short data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update recall dataset"
            git push
          else
            echo "No dataset changes"
          fi
