<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RecallRx social preview</title>
  <desc id="desc">RecallRx makes official medicine recall notices country-aware, normalized, and searchable.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#10242a" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f5f7fa"/>
  <rect width="400" height="630" fill="#006d77"/>

  <g fill="#ffffff" opacity=".12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">
    <text x="38" y="65">R_21/2026</text>
    <text x="226" y="108">CN 755215</text>
    <text x="48" y="532">CI 054/CD</text>
    <text x="188" y="575">CIP 3400955062400</text>
  </g>

  <!-- The primary mark is embedded so social previews remain self-contained. -->
  <g transform="translate(72 151) scale(.25)" filter="url(#shadow)">
    <rect width="1024" height="1024" rx="196" fill="#f8fafc"/>
    <path d="M788 741C884 600 874 409 764 280C653 150 461 113 309 194C213 245 147 337 132 444" fill="none" stroke="#006d77" stroke-width="76" stroke-linecap="round"/>
    <path d="M69 381 126 553 253 423Z" fill="#006d77"/>
    <g transform="rotate(-42 512 512)">
      <path d="M512 222C429 222 362 289 362 372V512H662V372C662 289 595 222 512 222Z" fill="#eab308"/>
      <path d="M362 512V652C362 735 429 802 512 802S662 735 662 652V512Z" fill="#e6fffb"/>
      <rect x="362" y="222" width="300" height="580" rx="150" fill="none" stroke="#18202a" stroke-width="48"/>
      <path d="M382 512H642" stroke="#18202a" stroke-width="40"/>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="470" y="116" fill="#006d77" font-size="19" font-weight="800" letter-spacing="2">OFFICIAL PUBLIC SOURCES</text>
    <text x="464" y="220" fill="#18202a" font-size="84" font-weight="800" letter-spacing="0">RecallRx</text>
    <text x="470" y="286" fill="#4f5e6d" font-size="31" font-weight="550">Medicine recall notices,</text>
    <text x="470" y="328" fill="#4f5e6d" font-size="31" font-weight="550">normalized and searchable.</text>

    <g font-size="20" font-weight="750">
      <text x="470" y="410" fill="#18202a">ES</text><text x="506" y="410" fill="#617082">AEMPS</text>
      <circle cx="600" cy="403" r="4" fill="#eab308"/>
      <text x="624" y="410" fill="#18202a">PT</text><text x="662" y="410" fill="#617082">INFARMED</text>
      <circle cx="792" cy="403" r="4" fill="#eab308"/>
      <text x="816" y="410" fill="#18202a">FR</text><text x="854" y="410" fill="#617082">ANSM</text>
    </g>

    <path d="M470 475H1116" stroke="#d8e0e8" stroke-width="2"/>
    <text x="470" y="526" fill="#006d77" font-size="16" font-weight="800" letter-spacing="1.2">STATIC / COUNTRY-AWARE / SOURCE-LINKED</text>
  </g>
</svg>
