[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recallrx"
version = "0.1.0"
description = "Static, country-aware medicine recall search from official public sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "requests>=2.31",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "requests-mock>=1.12",
]

[project.scripts]
recallrx = "recallrx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
